name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    name: Test & Build
    runs-on: ubuntu-latest
    steps:
      - name: Check out code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version-file: ".python-version"

      - name: Set up uv
        uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true

      - name: Install pnpm
        uses: pnpm/action-setup@v4

      - name: Use Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: "pnpm"

      - name: Cache civitai lora fixtures
        uses: actions/cache@v4
        with:
          path: tests/e2e/fixtures
          key: civitai-fixtures-${{ hashFiles('tests/e2e/fixtures.lock.json') }}

      - name: Cache e2e ComfyUI environment
        uses: actions/cache@v4
        with:
          path: .e2e
          key: e2e-env-${{ runner.os }}-${{ hashFiles('e2e.config.mjs', 'tests/e2e/versions.lock.json') }}

      - name: Install dependencies
        run: pnpm install

      - name: Sync Python dependencies
        run: uv sync --locked

      - name: Typecheck
        run: pnpm typecheck

      - name: Run full test suite (unit + e2e, live civitai API)
        run: pnpm test

      - name: Build
        run: pnpm build
